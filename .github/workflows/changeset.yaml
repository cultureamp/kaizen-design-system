name: Changeset

on:
  push:
    branches:
      - 'main'
      - 'release/**' # Support release branches

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
      hasPublished: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Create Release Pull Request or Publish to npm
        run: |
          npm config set "//registry.npmjs.org/:_authToken" "$NPM_TOKEN"
      - uses: changesets/action@v1
        id: changesets
        with:
          title: 'Changeset: Version packages'
          commit: 'version packages'
          version: pnpm ci:version
          publish: pnpm ci:publish

      - name: Trigger Documentation Generation
        if: steps.changesets.outputs.published == 'true'
        uses: ./.github/actions/trigger-docs
        with:
          published_packages: ${{ steps.changesets.outputs.publishedPackages }}
          buildkite_webhook_url: ${{ secrets.ENCHIRIDION_BUILDKITE_WEBHOOK_URL }}

  notify-slack-success:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: version
    if: needs.version.outputs.hasPublished == 'true'
    steps:
      - name: Notify successful publish
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: 'C02NUQ27G56'
          slack-message: 'Packages have been published'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  notify-slack-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: version
    if: ${{ always() && needs.version.result == 'failure' }}
    steps:
      - uses: actions/checkout@v4

      - name: Get failure context
        id: context
        run: |
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          SUBJECT=$(git log -1 --format='%s' "$SHA")
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "subject=$SUBJECT" >> "$GITHUB_OUTPUT"
          echo "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Notify publish failure
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: 'C02NUQ27G56'
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Publishing failed*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|`${{ steps.context.outputs.short_sha }}`> ${{ steps.context.outputs.subject }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Pushed by:* ${{ github.actor }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View failed run"
                      },
                      "url": "${{ steps.context.outputs.run_url }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
