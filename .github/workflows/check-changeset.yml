name: Check changeset

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  check-changeset:
    if: github.ref != 'refs/heads/changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for package output changes without changeset
        run: |
          # Get changed files compared to origin/main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          # Check if any changeset files exist (markdown files in .changeset, excluding README)
          HAS_CHANGESET=false
          for file in $CHANGED_FILES; do
            if [[ "$file" == .changeset/*.md ]] && [[ "$file" != ".changeset/README.md" ]]; then
              HAS_CHANGESET=true
              break
            fi
          done

          # Check if any package source files that affect output have changed
          HAS_PACKAGE_CHANGES=false
          for file in $CHANGED_FILES; do
            if [[ "$file" == packages/*/src/** ]] || \
               [[ "$file" == packages/*/package.json ]] || \
               [[ "$file" == packages/*/tsconfig*.json ]] || \
               [[ "$file" == packages/*/rollup.config* ]] || \
               [[ "$file" == packages/*/vite.config* ]] || \
               [[ "$file" == packages/*/styles/** ]] || \
               [[ "$file" == packages/*/css/** ]] || \
               [[ "$file" == packages/*/sass/** ]] || \
               [[ "$file" == packages/*/less/** ]]; then
              HAS_PACKAGE_CHANGES=true
              break
            fi
          done

          echo "Has changeset: $HAS_CHANGESET"
          echo "Has package output changes: $HAS_PACKAGE_CHANGES"

          if [[ "$HAS_PACKAGE_CHANGES" == "true" ]] && [[ "$HAS_CHANGESET" == "false" ]]; then
            echo "::error::Package source files have changed but no changeset was found. Please run 'pnpm changeset' to add a changeset describing the changes."
            exit 1
          fi

          echo "✓ Changeset check passed"
